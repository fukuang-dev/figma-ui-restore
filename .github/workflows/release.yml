name: Release
on:
  push:
    tags: ['v*']
  release:
    types: [published]
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Check tag matches manifest
        run: python -c "import json,os; assert os.environ['GITHUB_REF_NAME']=='v'+json.load(open('plugin.json'))['version']"
      - run: python scripts/validate.py
      - run: python -m unittest discover -s tests -v
      - run: python scripts/package.py
      - name: Publish release archive
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" --verify-tag --title "$GITHUB_REF_NAME" --notes-file docs/release-notes.md
          fi
          gh release upload "$GITHUB_REF_NAME" dist/*.zip --clobber
